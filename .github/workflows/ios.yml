name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

defaults:
  run:
    working-directory: ios

jobs:
  check:
    name: Check
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Ensure SwiftFormat
        run: command -v swiftformat >/dev/null || brew install swiftformat
      - name: Run SwiftFormat (lint mode)
        run: swiftformat --lint --quiet --exclude Milesto/Sources/Shared/Components/TablerIcons.swift .
      - name: Cache Xcode build data
        uses: actions/cache@v5.0.5
        with:
          path: |
            ios/.build/DerivedData
            ios/.build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-ios-xcode-${{ hashFiles('ios/Milesto.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ hashFiles('ios/Milesto.xcodeproj/project.pbxproj', 'ios/Milesto/Sources/**/*.swift', 'ios/Milesto/Resources/Locales/**/*.xcstrings', 'ios/Milesto/Resources/Assets.xcassets/**', 'ios/Milesto/Config/**') }}
          restore-keys: |
            ${{ runner.os }}-ios-xcode-${{ hashFiles('ios/Milesto.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            ${{ runner.os }}-ios-xcode-
      - name: Build
        shell: bash
        run: |
          xcodebuild build \
            -project Milesto.xcodeproj \
            -scheme Milesto \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath .build/DerivedData \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_PREVIEWS=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS="$(uname -m)"
      - name: Cancel sibling runs
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for status in queued in_progress waiting requested; do
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --commit "$PR_HEAD_SHA" \
              --status "$status" \
              --json databaseId \
              --jq '.[].databaseId' \
            | while read -r run_id; do
                [ -z "$run_id" ] && continue
                [ "$run_id" = "$CURRENT_RUN_ID" ] && continue
                gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
              done
          done
